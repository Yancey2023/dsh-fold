# dsh-fold bundle patch — the `dsh.bundle.patch` layer of the npm package.
#
# Installing through the official plugin CLI —
#
#   dsh plugin --profile web add dsh-fold
#   (or, from this checkout:  pnpm run install:dsh)
#
# — reconciles `dsh.profile.bundles` against the installed package and, seeing
# this declaration, appends `dsh-fold` to the bundle stack. The profile
# boot then merges THIS patch (one `insert` of the plugin row) exactly like a
# manual cordis.patch.yml mount line used to. One command installs AND mounts;
# no profile file edits needed.
#
# The row is the HOST anchor only: the client loader scans installed bundles
# for the package's `dsh.client.platform: "web"` manifest and serves
# `exports["./client"]` to the page. All UI work happens in the browser half.
#
# If the profile still carries a manual `fold` row from an earlier
# manual install, remove it before switching to the bundle channel to avoid
# double-mounting (two host halves).
- insert:
    - id: fold
      name: 'dsh-fold'
